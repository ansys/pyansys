repos:

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 9026c9127e153371d7a78dfcb0c45ae2046a3d10  # frozen: v0.17.6
  hooks:
    - id: ruff
    - id: ruff-format

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
  hooks:
  - id: codespell
    args: ["--ignore-words=ignore_words.txt"]
    exclude: "doc/source/_static"

- repo: https://github.com/pycqa/pydocstyle
  rev: 07f6707e2c5612960347f7c00125620457f490a7  # frozen: 6.3.0
  hooks:
  - id: pydocstyle
    additional_dependencies: [toml]
    exclude: "tests/"

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
  hooks:
  - id: check-merge-conflict
  - id: debug-statements
  - id: check-yaml
  - id: trailing-whitespace

# this validates our github workflow files
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 39478bf2c099a58683d3f1aedf675105318b078d  # frozen: 0.39.0
  hooks:
    - id: check-github-workflows

- repo: https://github.com/ansys/pre-commit-hooks
  rev: e55c4e315cb8ce98e3b81c63b5e869cfc3114039  # frozen: v0.8.2
  hooks:
  - id: add-license-headers
    args:
    - --start_year=2022

- repo: https://github.com/pre-commit/mirrors-prettier
  rev: 'f12edd9c7be1c20cfa42420fd0e6df71e42b51ea'  # frozen: v4.0.0-alpha.8
  hooks:
  - id: prettier
    types_or: [css, javascript]
