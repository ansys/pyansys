name: Relock Dependabot pip PRs

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  relock:
    name: Regenerate uv.lock against the bumped pin
    # The "pip" ecosystem only edits pyproject.toml, so its PRs need uv.lock
    # regenerated. A failure here means the bumped version is incompatible -
    # exactly what the "uv" ecosystem would have hidden by skipping the PR.
    # The "build(pip-relock)" commit-message prefix (dependabot.yml, "pip" entry)
    # also becomes the PR title prefix, which is what gates this job.
    if: github.actor == 'dependabot[bot]' && startsWith(github.event.pull_request.title, 'build(pip-relock)')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.PYANSYS_CI_BOT_TOKEN }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d #v10.0.1

      - name: Regenerate the lockfile for the bumped dependency
        run: uv lock

      - name: Commit the regenerated lockfile
        env:
          GIT_AUTHOR_NAME: ${{ secrets.PYANSYS_CI_BOT_USERNAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.PYANSYS_CI_BOT_EMAIL }}
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore: relock uv.lock for dependabot pip bump [dependabot-skip]"
          git push origin HEAD:$GITHUB_HEAD_REF
